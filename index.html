<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>淡江大學環境平台 | 智慧土壤溼度檢測系統</title>
    
    <!-- 引入 Leaflet 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 引入 Plotly 專業繪圖庫 -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <style>
        /* ================= 頂級精品視覺設定 ================= */
        :root {
            --primary-green: #00E676;
            --primary-red: #FF3D00;
            --card-bg: rgba(25, 27, 33, 0.45);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #F3F4F6;
            --text-sub: #9CA3AF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e2433 0%, #0a0c10 100%);
            color: var(--text-main);
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 50px 20px 40px;
        }
        .header h2 { 
            margin: 0; 
            font-size: 1rem; 
            color: var(--text-sub); 
            letter-spacing: 8px; 
            font-weight: 300;
            text-transform: uppercase;
        }
        .header h1 { 
            margin: 15px 0 0 0; 
            font-size: 2.8rem; 
            letter-spacing: 4px; 
            font-weight: 600;
            background: linear-gradient(135deg, #ffffff 0%, #a0a5b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr; 
            gap: 30px;
            padding: 0 50px 60px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .card-full-width { grid-column: 1 / -1; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 35px;
            border: 1px solid var(--card-border);
            border-top: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }
        
        .card h3 { 
            margin: 0 0 25px 0; 
            font-size: 1.1rem; 
            color: var(--text-sub); 
            font-weight: 400;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
        }
        .card h3::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4393c3;
            border-radius: 50%;
            margin-right: 12px;
            box-shadow: 0 0 10px #4393c3;
        }
        
        .data-display { text-align: center; margin: auto 0; }
        .moisture-value { 
            font-size: 7rem; 
            font-weight: 700; 
            color: var(--primary-green); 
            line-height: 1; 
            margin-bottom: 25px;
            font-family: 'Arial', sans-serif;
            text-shadow: 0 0 30px rgba(0, 230, 118, 0.4); 
        }
        .status { 
            font-size: 1.4rem; 
            font-weight: 500; 
            padding: 12px 30px; 
            border-radius: 50px; 
            display: inline-block;
            letter-spacing: 2px;
            border: 1px solid transparent;
        }
        .status.safe { 
            color: var(--primary-green); 
            background: rgba(0, 230, 118, 0.1);
            border-color: rgba(0, 230, 118, 0.3);
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.2);
        }
        .status.warning { 
            color: var(--primary-red); 
            background: rgba(255, 61, 0, 0.1);
            border-color: rgba(255, 61, 0, 0.3);
            box-shadow: 0 0 20px rgba(255, 61, 0, 0.2);
            animation: pulse-red 2s infinite; 
        }
        
        #map { height: 400px; border-radius: 16px; width: 100%; border: 1px solid var(--card-border);}
        .chart-container { height: 500px; width: 100%; }

        @keyframes pulse-red { 
            0% { box-shadow: 0 0 20px rgba(255, 61, 0, 0.2); } 
            50% { box-shadow: 0 0 40px rgba(255, 61, 0, 0.6); } 
            100% { box-shadow: 0 0 20px rgba(255, 61, 0, 0.2); } 
        }

        /* ================= 📱 手機版 RWD 響應式魔法 ================= */
        @media (max-width: 800px) {
            .header { padding: 30px 15px 20px; }
            .header h1 { font-size: 1.8rem; letter-spacing: 2px; }
            .header h2 { font-size: 0.8rem; letter-spacing: 4px; }
            
            .container {
                grid-template-columns: 1fr; /* 強制變為單欄直排 */
                padding: 0 15px 30px;
                gap: 20px;
            }
            .card { padding: 20px; border-radius: 16px; }
            
            .moisture-value { font-size: 4.5rem; }
            .moisture-value span { font-size: 2rem !important; } /* 縮小 % 符號 */
            .status { font-size: 1rem; padding: 10px 15px; }
            
            #map { height: 300px; }
            .chart-container { height: 350px; } /* 縮小圖表高度避免佔滿整個手機螢幕 */
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>淡江大學環境平台</h2>
        <h1>智慧土壤溼度檢測系統</h1>
    </div>

    <div class="container">
        <div class="card">
            <h3>測站即時數據 (中央控制站)</h3>
            <div class="data-display">
                <div class="moisture-value" id="moisture">--<span style="font-size: 3rem;">%</span></div>
                <div class="status safe" id="pump-status">連線中...</div>
            </div>
        </div>

        <div class="card">
            <h3>觀測地圖佈署</h3>
            <div id="map"></div>
        </div>

        <div class="card card-full-width">
            <h3>濕度歷史趨勢圖</h3>
            <div id="line-chart" class="chart-container"></div>
        </div>

        <div class="card card-full-width">
            <h3>觀測區濕度分佈等高線 (100x100m 展延分析)</h3>
            <div id="contour-chart" class="chart-container"></div>
        </div>
    </div>

    <script>
        const channelID = '3211524'; 
        const readAPIKey = '5Z5AS4AK5SBVOFIF'; 

        const tkLat = 25.175629;
        const tkLon = 121.450675;
        const map = L.map('map', {zoomControl: false}).setView([tkLat, tkLon], 16);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '' 
        }).addTo(map);

        const customIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div style='background-color:#00E676; width:15px; height:15px; border-radius:50%; border:3px solid #fff; box-shadow: 0 0 15px #00E676;'></div>",
            iconSize: [15, 15],
            iconAnchor: [7, 7]
        });
        L.marker([tkLat, tkLon], {icon: customIcon}).addTo(map);

        // Plotly RWD 自動適應設定 (新增 responsive: true)
        const elegantLayout = {
            paper_bgcolor: 'rgba(0,0,0,0)',
            plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: '#9CA3AF', size: 12, family: 'Helvetica Neue' },
            margin: { t: 10, b: 40, l: 40, r: 10 }, // 縮小圖表邊界留白
            xaxis: { gridcolor: 'rgba(255,255,255,0.05)', zerolinecolor: 'rgba(255,255,255,0.1)' },
            yaxis: { gridcolor: 'rgba(255,255,255,0.05)', zerolinecolor: 'rgba(255,255,255,0.1)' },
            hoverlabel: { bgcolor: '#1e2433', font: { color: '#fff' } }
        };

        async function updateDashboard() {
            try {
                const response = await fetch(`https://api.thingspeak.com/channels/${channelID}/feeds.json?api_key=${readAPIKey}&results=30`);
                const data = await response.json();
                
                if (data.feeds && data.feeds.length > 0) {
                    const times = data.feeds.map(f => {
                        let d = new Date(f.created_at);
                        return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
                    });
                    const moistures = data.feeds.map(f => parseInt(f.field1));
                    const latestMoisture = moistures[moistures.length - 1];

                    const moistureEl = document.getElementById('moisture');
                    const statusEl = document.getElementById('pump-status');
                    
                    moistureEl.innerHTML = latestMoisture + '<span style="font-size: 3.5rem; color: rgba(255,255,255,0.5); margin-left: 10px;">%</span>';
                    
                    if (latestMoisture < 30) {
                        moistureEl.style.color = 'var(--primary-red)';
                        moistureEl.style.textShadow = '0 0 30px rgba(255, 61, 0, 0.4)';
                        statusEl.innerText = '系統已接管 ‧ 啟動自動澆水';
                        statusEl.className = 'status warning';
                    } else {
                        moistureEl.style.color = 'var(--primary-green)';
                        moistureEl.style.textShadow = '0 0 30px rgba(0, 230, 118, 0.4)';
                        statusEl.innerText = '全域環境穩定 ‧ 待機監測中';
                        statusEl.className = 'status safe';
                    }

                    const traceLine = {
                        x: times,
                        y: moistures,
                        type: 'scatter',
                        mode: 'lines',
                        line: { color: '#00D0FF', width: 3, shape: 'spline', smoothing: 1.3 }, 
                        fill: 'tozeroy',
                        fillcolor: 'rgba(0, 208, 255, 0.08)' 
                    };
                    Plotly.newPlot('line-chart', [traceLine], elegantLayout, {responsive: true, displayModeBar: false});

                    const x_data = []; const y_data = []; const z_data = [];
                    for(let i = 0; i < 40; i++) {
                        let px = Math.random() * 100; 
                        let py = Math.random() * 100; 
                        x_data.push(px); y_data.push(py);
                        let macroTopo = Math.sin(px * 0.05) * Math.cos(py * 0.05) * 6;
                        let runoffGradient = (px * 0.15) - ((100 - py) * 0.1);
                        let simulatedMoisture = latestMoisture + runoffGradient + macroTopo;
                        z_data.push(Math.max(0, Math.min(100, simulatedMoisture)));
                    }
                    x_data.push(50); y_data.push(50); z_data.push(latestMoisture);

                    const traceContour = {
                        x: x_data, y: y_data, z: z_data,
                        type: 'contour',
                        colorscale: [
                            [0.0, '#4a0c16'], [0.2, '#962b2b'], [0.4, '#c98555'], 
                            [0.6, '#3a7285'], [0.8, '#26598c'], [1.0, '#102a4a'] 
                        ],
                        contours: { coloring: 'heatmap', showlines: true, smoothing: 1.3 }, 
                        colorbar: { title: {text: '濕度 (%)', font: {color: '#9CA3AF'}}, tickfont: {color: '#9CA3AF'} },
                        name: '等高線'
                    };
                    
                    const contourLayout = Object.assign({}, elegantLayout);
                    contourLayout.xaxis = { title: '東西(m)', range: [0, 100], gridcolor: 'rgba(255,255,255,0.05)' };
                    contourLayout.yaxis = { title: '南北(m)', range: [0, 100], gridcolor: 'rgba(255,255,255,0.05)' };

                    Plotly.newPlot('contour-chart', [traceContour], contourLayout, {responsive: true, displayModeBar: false});
                }
            } catch (error) {
                console.error('API 讀取錯誤:', error);
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 15000);
    </script>
</body>
</html>
